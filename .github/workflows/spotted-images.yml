name: spotted-images

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  post-recent-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore image watermark
        uses: actions/cache@v4
        with:
          path: .spotted_images_state.json
          key: spotted-images-state-${{ github.run_id }}
          restore-keys: |
            spotted-images-state-
      - name: POST recent #spotted images
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SLACK_CHANNEL_ID: C06J25K5V1A
        run: python -m spotted_images.job
